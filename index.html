<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel, Tesoura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pedra, Papel, Tesoura</h1>
        <p class="instructions">O primeiro a marcar 3 pontos vence a partida!</p>

        <div class="scoreboard">
            <div class="score">
                <h2>Você</h2>
                <span id="player-score">0</span>
            </div>
            <div class="score">
                <h2>Computador</h2>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div class="message" id="message">Faça sua jogada!</div>

        <div class="choices" id="choices">
            <button class="choice" id="pedra">✊ Pedra</button>
            <button class="choice" id="papel">✋ Papel</button>
            <button class="choice" id="tesoura">✌️ Tesoura</button>
        </div>

        <button id="restart-btn" class="hidden">Reiniciar Jogo</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
